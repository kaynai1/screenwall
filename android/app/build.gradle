plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.screenwall.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.screenwall.android"
        minSdk 24
        targetSdk 34
        versionCode 222
        versionName "0.2.22"
    }

    // 发到 Release 的安装包必须带签名，否则手机装不上、更装不上更新。
    // 密钥不进仓库：keystore.properties 只记录本机路径与口令，已 gitignore，
    // 文件缺失时退回 debug 签名（本地自测用，不要拿这个包分发）。
    signingConfigs {
        release {
            def properties = rootProject.file('keystore.properties')
            if (properties.exists()) {
                def props = new Properties()
                properties.withInputStream { props.load(it) }
                storeFile file(props.storeFile)
                storePassword props.storePassword
                keyAlias props.keyAlias
                keyPassword props.keyPassword
            }
        }
    }

    buildTypes {
        release {
            // 没有 keystore.properties（没在本机配置签名）就跳过，留成无签名包，
            // 只在本地自测用，避免 CI 或别人 clone 时直接报错。
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // WebRTC P2P：与网页端同一套信令与被控端 webrtc-rs 对接。
    implementation 'io.github.webrtc-sdk:android:125.6422.07'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
