# 这台机器常驻模拟器等程序，内存偏紧：限制 Gradle / Kotlin 守护进程堆，避免 JVM 直接 OOM。
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 本机工具链（用户环境固定使用这套 JDK 17）。
org.gradle.java.home=D:/tools/jdk17/jdk-17.0.17+10
