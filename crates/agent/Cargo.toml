[package]
name = "screenwall-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "screenwall-agent"
path = "src/main.rs"

[dependencies]
screenwall-proto = { path = "../proto" }
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.2"
hex = "0.4"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
audiopus = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
urlencoding = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
png = "0.18"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Variant"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
screenwall-server = { path = "../server" }
